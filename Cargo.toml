[package]
name = "reclaim"
version = "0.1.1"
edition = "2024"
authors = ["AbyssWhalen"]
description = "上下文感知的项目垃圾清理器：扫出 node_modules / target / __pycache__ 等构建产物，按大小排序，交互勾选后移入回收站。Context-aware project junk cleaner."
repository = "https://github.com/AbyssWhalen/reclaim"
license = "MIT"
readme = "README.md"
keywords = ["cli", "cleaner", "disk-space", "node-modules", "tui"]
categories = ["command-line-utilities", "filesystem"]
exclude = ["/.github", "/CLAUDE.md"]

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
crossterm = "0.29.0"
humansize = "2.1.3"
ignore = "0.4.26"
ratatui = "0.30.1"
rayon = "1.12.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
trash = "5.2.6"
walkdir = "2.5.0"
